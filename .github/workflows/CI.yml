name: CI
on:
  workflow_dispatch:
  repository_dispatch:
    types: [auto-pr-created]
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:

concurrency:
  # Group runs by the workflow name and the branch or tag name
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Clone registries/packages directly from their git sources instead of the
# Julia package server, which intermittently 404s on stale registry trees.
env:
  JULIA_PKG_SERVER: ""

jobs:
  reuse-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run REUSE lint
        run: docker run --rm --volume ${{ github.workspace }}:/data fsfe/reuse lint

  test-with-code-coverage:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ matrix.backend || 'monolith' }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    # Temporarily wide so a monolith job runs to completion and prints its
    # per-model build times; drop back to 180 once the slow build is found.
    timeout-minutes: 1000
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.12'
        os:
          - ubuntu-latest
          - windows-latest
        arch:
          - x64
        # A distinct `backend` keeps the kernel-backend entry below from being
        # merged into the ubuntu/1.12 combination; it becomes its own job.
        backend:
          - monolith
        exclude:
          - os: macOS-latest
            arch: x64
        # `coverage` marks the one job per backend that reports to Codecov.
        # Everywhere else it stays off: instrumented code runs slower, and
        # `Pkg.test` precompiles the whole tree again under the coverage
        # configuration because Julia keys its caches by that configuration.
        include:
          - os: ubuntu-latest
            version: '1.11'
            arch: x64
            prefix: xvfb-run -a
          - os: ubuntu-latest
            version: '1.12'
            arch: x64
            prefix: xvfb-run -a
            coverage: true
          - os: macOS-latest
            version: '1.12'
            arch: aarch64
          - os: ubuntu-latest
            version: '1.12'
            arch: x64
            prefix: xvfb-run -a
            backend: kernel
            coverage: true

    steps:
      - uses: actions/checkout@v7

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}

      - name: Install display dependencies for GLMakie
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri

      # Only Linux gets a GL stack (xvfb + mesa above); elsewhere GLMakie cannot build.
      - name: Drop GLMakie where there is no display
        if: runner.os != 'Linux'
        shell: bash
        run: |
          grep -v -E '^(GLMakie|MakieControlPlots) = ' test/Project.toml \
            > test/Project.toml.tmp
          mv test/Project.toml.tmp test/Project.toml

      # A restored registry is a git clone Pkg refuses to update once it goes
      # dirty, pinning resolution to whatever the cache holds (Pkg.jl#4557).
      - uses: julia-actions/cache@v3
        with:
          cache-registries: 'false'

      - name: Prepare version-specific manifest
        shell: bash
        run: |
          JULIA_VERSION=$(julia --version | awk '{print $3}' | cut -d'.' -f1,2)
          DEFAULT="Manifest-v${JULIA_VERSION}.toml.default"
          TARGET="Manifest-v${JULIA_VERSION}.toml"
          if [ -f "$DEFAULT" ] && [ ! -f "$TARGET" ]; then
            cp "$DEFAULT" "$TARGET"
            echo "Copied $DEFAULT to $TARGET"
          fi

      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          prefix: ${{ matrix.prefix }}
          coverage: ${{ matrix.coverage == true }}
        env:
          SYMAWE_TEST_BACKEND: ${{ matrix.backend }}

      - name: Upload PNG plots as artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-plots-${{ matrix.os }}-julia${{ matrix.version }}-${{ matrix.arch }}-${{ matrix.backend || 'monolith' }}
          path: data/*.png
          if-no-files-found: ignore
          retention-days: 7

      # A failing suite still covers most of the source, and dropping its report
      # leaves the backend it exercises reading as 0% against the other jobs.
      - uses: julia-actions/julia-processcoverage@v1
        if: ${{ matrix.coverage == true && !cancelled() }}

      - uses: codecov/codecov-action@v7
        if: ${{ matrix.coverage == true && !cancelled() }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
        continue-on-error: true

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'

      - uses: julia-actions/cache@v3
        with:
          cache-registries: 'false'
      - uses: julia-actions/julia-buildpkg@v1

      - name: Install display dependencies for GLMakie
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri

      # Under xvfb because instantiate precompiles GLMakie, whose __init__ opens
      # a window; without a display it fails and the later steps redo the work.
      - name: Instantiate docs project
        run: |
          xvfb-run -a julia --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()'

      - name: Generate figures
        run: >
          xvfb-run -a
          julia --project=docs docs/generate_figures.jl

      - uses: julia-actions/julia-docdeploy@v1
        with:
          # Single word only: docdeploy quotes the prefix, so "xvfb-run -a" would
          # be exec'd as one command name (julia-runtest word-splits it instead).
          prefix: xvfb-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
