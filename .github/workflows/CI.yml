name: CI
on:
  workflow_dispatch:
  repository_dispatch:
    types: [auto-pr-created]
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:

concurrency:
  # Group runs by the workflow name and the branch or tag name
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Clone registries/packages directly from their git sources instead of the
# Julia package server, which intermittently 404s on stale registry trees.
env:
  JULIA_PKG_SERVER: ""

jobs:
  reuse-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run REUSE lint
        run: docker run --rm --volume ${{ github.workspace }}:/data fsfe/reuse lint

  # The matrix is one entry per runner configuration and test group, so that the
  # runner configurations and the split live in `test/ci_matrix.jl` next to the
  # suite instead of being duplicated here.
  test-matrix:
    name: Compute the test matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.compute.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'

      - name: Compute the test matrix
        id: compute
        run: |
          MATRIX=$(julia test/ci_matrix.jl)
          echo "Matrix: $MATRIX"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  test-with-code-coverage:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ matrix.backend }} - group ${{ matrix.group }}/${{ matrix.groups }}
    needs: test-matrix
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.test-matrix.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v7

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}

      - name: Install display dependencies for GLMakie
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri

      # Only Linux gets a GL stack (xvfb + mesa above); elsewhere GLMakie cannot build.
      - name: Drop GLMakie where there is no display
        if: runner.os != 'Linux'
        shell: bash
        run: |
          grep -v -E '^(GLMakie|MakieControlPlots) = ' test/Project.toml \
            > test/Project.toml.tmp
          mv test/Project.toml.tmp test/Project.toml

      # A restored registry is a git clone Pkg refuses to update once it goes
      # dirty, pinning resolution to whatever the cache holds (Pkg.jl#4557).
      # The key names the depot the job needs rather than the whole matrix row,
      # so the groups of one configuration share a single cache entry instead of
      # each saving its own multi-gigabyte copy of the same depot.
      - uses: julia-actions/cache@v3
        with:
          cache-registries: 'false'
          include-matrix: 'false'
          cache-name: julia-cache;workflow=${{ github.workflow }};version=${{ matrix.version }};arch=${{ matrix.arch }}

      - name: Prepare version-specific manifest
        shell: bash
        run: |
          JULIA_VERSION=$(julia --version | awk '{print $3}' | cut -d'.' -f1,2)
          DEFAULT="Manifest-v${JULIA_VERSION}.toml.default"
          TARGET="Manifest-v${JULIA_VERSION}.toml"
          if [ -f "$DEFAULT" ] && [ ! -f "$TARGET" ]; then
            cp "$DEFAULT" "$TARGET"
            echo "Copied $DEFAULT to $TARGET"
          fi

      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          prefix: ${{ matrix.prefix }}
          coverage: ${{ matrix.coverage == true }}
          test_args: ${{ matrix.files }}
        env:
          SYMAWE_TEST_BACKEND: ${{ matrix.backend }}

      - name: Upload PNG plots as artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-plots-${{ matrix.os }}-julia${{ matrix.version }}-${{ matrix.arch }}-${{ matrix.backend }}-group${{ matrix.group }}
          path: data/*.png
          if-no-files-found: ignore
          retention-days: 7

      # A failing suite still covers most of the source, and dropping its report
      # leaves the backend it exercises reading as 0% against the other jobs.
      - uses: julia-actions/julia-processcoverage@v1
        if: ${{ matrix.coverage == true && !cancelled() }}

      - uses: codecov/codecov-action@v7
        if: ${{ matrix.coverage == true && !cancelled() }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
        continue-on-error: true

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'

      - uses: julia-actions/cache@v3
        with:
          cache-registries: 'false'
      - uses: julia-actions/julia-buildpkg@v1

      - name: Install display dependencies for GLMakie
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri

      # Under xvfb because instantiate precompiles GLMakie, whose __init__ opens
      # a window; without a display it fails and the later steps redo the work.
      - name: Instantiate docs project
        run: |
          xvfb-run -a julia --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()'

      - name: Generate figures
        run: >
          xvfb-run -a
          julia --project=docs docs/generate_figures.jl

      - uses: julia-actions/julia-docdeploy@v1
        with:
          # Single word only: docdeploy quotes the prefix, so "xvfb-run -a" would
          # be exec'd as one command name (julia-runtest word-splits it instead).
          prefix: xvfb-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
